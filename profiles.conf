# mpv 配置文件预设
# 使用方式：在 mpv.conf 中添加 "profile=游戏" 来应用特定预设

# 游戏模式 - 低延迟，高性能
[游戏]
profile-desc=游戏模式：低延迟，高性能
hwdec=nvdec-copy,auto-copy-safe
video-sync=display-resample
interpolation=no
deband=no
video-latency-hacks=yes
# gpu-api / gpu-context 不在这里强制：原写法（vulkan + waylandvk）在没有 Vulkan 的
# Windows 机器上会直接初始化失败。渲染后端交给 platform.conf 与 mpv 自己选择，
# Linux/Wayland 仍会由 [platform-linux] 注入 gpu-context=waylandvk。
# 减少缓存以提高响应速度
cache=no
demuxer-max-bytes=8MiB
demuxer-max-back-bytes=4MiB

# 色彩策略：默认 -> Target；电影/动画 -> ICC；HDR -> Target/HDR 自动条件组
# 电影模式 - 高质量，最佳画质
[电影]
profile-desc=电影模式：高质量画质
hwdec=nvdec-copy,auto-copy-safe
video-sync=display-resample
interpolation=yes
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4
icc-profile-auto=yes
target-colorspace-hint=yes
hdr-compute-peak=yes
tone-mapping=hable
target-peak=100

# 动画模式 - 专门优化动画播放
[动画]
profile-desc=动画模式：专门优化动画
hwdec=nvdec-copy,auto-copy-safe
video-sync=display-resample
interpolation=yes
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16
deband-grain=6
icc-profile-auto=yes
# 动画专用着色器预设
glsl-shaders="~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K/glsl/Deblur/Anime4K_Deblur_DoG.glsl"

# 低功耗模式 - 省电，适合笔记本
[低功耗]
profile-desc=低功耗模式：省电优化
hwdec=nvdec-copy,auto-copy-safe
video-sync=audio
interpolation=no
deband=no
icc-profile-auto=no
# 降低CPU使用率
vd-lavc-threads=2
vd-lavc-skiploopfilter=all
vd-lavc-fast=yes
# 降低GPU负载
scale=bilinear
dscale=bilinear
cscale=bilinear

# 网络流媒体模式 - 优化在线视频
[网络流]
profile-desc=网络流媒体模式：优化在线视频
profile-cond=get("demuxer-via-network", false) == true
profile-restore=copy
hwdec=nvdec-copy,auto-copy-safe
video-sync=display-resample
cache=yes
cache-secs=300
demuxer-readahead-secs=30
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=32MiB
# 网络优化
network-timeout=60
ytdl=yes
# 默认网络流限制 1080p；uosc 流质量菜单会在用户手动选择更高质量时运行时覆盖 ytdl-format。
ytdl-format=bestvideo[height<=?1080][vcodec!=?vp9]+bestaudio/best

# 网络流媒体模式 - 使用 Firefox cookies
[网络流-Firefox]
profile-desc=网络流媒体模式：使用 Firefox cookies
profile=网络流
ytdl-raw-options-append=cookies-from-browser=Firefox

# HDR模式 - 专门优化HDR内容
[HDR画质]
profile-desc=HDR模式：HDR内容优化
hwdec=nvdec-copy,auto-copy-safe
target-colorspace-hint=yes
hdr-compute-peak=yes
tone-mapping=hable
target-peak=203
gamut-mapping-mode=relative
icc-profile-auto=yes
# HDR专用着色器
glsl-shaders="~~/shaders/other/PixelClipper.glsl"

# 截图模式 - 高质量截图
[截图]
profile-desc=截图模式：高质量截图
screenshot-format=png
screenshot-png-compression=9
screenshot-png-filter=5
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes
screenshot-sw=no
# 注意：此处原设有 scale=lanczos / dscale=mitchell / cscale=mitchell，已移除。
# screenshot-sw=no 表示截图走当前 VO 渲染链，而这些取值弱于默认启用的 [HQ]
# （ewa_lanczossharp + catmull_rom），既降低截图质量，又因本 profile 没有
# profile-restore 而把弱缩放器残留给整个会话。截图专项优化由上方的
# screenshot-format / png-compression / png-filter / tag-colorspace / high-bit-depth 完成。

# 直播模式 - 实时流媒体
[直播]
profile-desc=直播模式：实时流媒体
hwdec=nvdec-copy,auto-copy-safe
video-sync=display-resample
cache=no
demuxer-max-bytes=2MiB
demuxer-max-back-bytes=1MiB
# 低延迟设置
video-latency-hacks=yes
# 网络优化
network-timeout=30
stream-lavf-o=reconnect_streamed=1,reconnect_delay_max=30
