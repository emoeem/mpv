# Linux 直播自动画质：依据实际 demuxer 缓存与断流状态在 resolver 提供的档位间切换。
enabled=yes
sample_interval=2.0
low_cache_seconds=5.0
critical_cache_seconds=2.0
recover_cache_seconds=18.0
upgrade_hold_seconds=30.0
downgrade_cooldown=8.0
max_switches_per_file=8
# auto：网络稳定时逐级恢复；balanced：只降级不主动升档；best：允许恢复到最高档。
prefer_quality=auto
show_osd=yes
