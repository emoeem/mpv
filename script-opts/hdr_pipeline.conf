# HDR 处理链双模式：原生直通 / hdr-toys
#
# native 保持本配置原有的 gpu-next 直通链（HDR / HDR-PASS + HDR2SDR 常驻参数）。
# toys 会接管 tone-mapping、gamut-mapping-mode、target-* 与 icc 相关属性，
# 挂上 hdr-toys 的 OUTPUT 着色器链，把 HDR 映射到 SDR 输出。
#
# 两种模式互斥，切换用 ALT+H 或「画面 > HDR 处理链」菜单。

# 启动模式：native 或 toys
# 默认 native，保证现有直通行为不变
mode=native

# 被接管的属性被其他写入方改掉后，延迟多久纠正（秒）
# 这是为了等待 [HDR] / [HDR-PASS] 自动 profile 与 linux-video-policy 先写完，
# 再一次性纠正，避免在同一帧内反复改写
guard_delay=0.08

# 定期复查间隔（秒），0 表示只依赖属性观察
guard_interval=1.0

# 切换模式与回退原生时是否显示 OSD 提示
osd=yes
