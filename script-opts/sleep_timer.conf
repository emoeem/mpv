# 睡眠定时器：到点后退出播放器、退出并保存进度，或暂停播放
#
# 只由 input.conf 的 CTRL+ALT+m 和「工具 > 睡眠定时器」菜单调用，
# 脚本本身不抢占任何裸键位。

# 打开菜单时的默认分钟数，也是未指定参数时的回退值
default_minutes=30

# 到点动作：quit / quit-watch-later / pause
# quit 在 idle=yes 下会直接结束 mpv 进程，适合睡前关机；
# quit-watch-later 只保存进度后退出播放，窗口行为仍受 idle 控制
action=quit

# 是否只累计实际播放时间
# no 表示按墙钟计时，暂停期间时间照常流逝（符合"定时关机"直觉）
# yes 表示暂停时冻结倒计时，适合中途频繁暂停的场景
pause_aware=no

# 进入最后多少秒后，每秒刷新一次倒计时 OSD
warn_seconds=60

# 是否向 uosc 注册底栏按钮
# 还需要在 script-opts/uosc.conf 的 controls= 里加入 button:sleep_timer，
# 只发 set-button 不会让按钮出现
button=yes
