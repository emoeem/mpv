# Socket 路径 (留空自动设置)
socket=

# 缩略图缓存路径 (留空自动设置)
thumbnail=

# 最大缩略图大小（以像素为单位）（缩小以适合）
# 当启用 hidpi 时此值会自适应缩放
max_height=120
max_width=214

# 叠加 ID
overlay_id=42

# 在文件加载时生成缩略图器，以更快地获得初始缩略图。默认禁用
spawn_first=yes

# 是否退出超时未活动的缩略图进程（秒），默认 0 即禁用
quit_after_inactivity=0

# 网络点播缩略图。默认开启，但只在首次悬停时按需启动并受下方超时保护；
# 实时直播、不可定位流与受保护格式仍自动禁用。
network=yes

# AList/OpenList/WebDAV 进度条缩略图：auto / yes / no。
# auto 仅在首次悬停时按需启动；若 2.5 秒内拿不到有效首帧，就对当前文件
# 自动熔断，避免第二路远程读取影响主播放。压缩包内视频始终不启用。
alist=auto

# auto 模式首帧超时（秒）；低于该门槛通常来不及形成稳定预览体验
remote_timeout=2.5

# 远程拖动时延后精确定位，移动中优先保留轻量关键帧预览
remote_exact_seek_delay=0.35

# 在音频播放时启用。默认禁用
audio=no

# 启用硬件解码生成缩略图。默认禁用
# 注意：硬解在高端显卡上可以加速生成缩略图，但在低端显卡上可能会出问题
hwdec=yes

# 两阶段预览：先快速显示附近关键帧，再更新为精确画面
# 首次悬停只在新帧就绪后显示，因此最多只发生一次画面校准
fast_seek=yes

# 鼠标稳定后再精确定位；拖动中只保留快速预览，避免精确解码排队
exact_seek_delay=0.16

# HDR 缩略图先缩小再做轻量 SDR 映射；不加载主画面的 Shader/超分/补帧链
hdr_tone_mapping=yes

# HDR 小型 GPU 预览器延后启动，先让主画面完成首帧；立即悬停仍会按需启动
hdr_prewarm_delay=1.2

# 仅限 Windows：逐次使用原生 Windows API 写入管道，避免长连接在密集拖动后堵塞
# 当前 MPV 内置 LuaJIT，已满足运行条件
direct_io=yes

# 指定 mpv 可执行文件的自定义路径。默认：mpv
mpv_path=mpv

# 指定需要忽略的视频扩展名黑名单，这些文件无法正常生成缩略图
blacklist_ext=bdmv,ifo

## 指定需忽略的共享盘（挂载盘）的路径/目录（缩略图生成性能差）
## windows 示例：excluded_dir=["X:", "Z:", "F:/Download/", "Download"]
#excluded_dir=[]
