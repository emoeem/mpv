# 资料卡（media-card.lua）
# 快捷键：CTRL+ALT+i 开/关；CTRL+ALT+S 公开分享；CTRL+ALT+SHIFT+S 私有分享

# 私有全量卡片仓库（Issue 表单与网页索引也在这里）
repo_cards=emoeem/mpv-cards

# 公开画廊仓库（GitHub Pages: https://emoeem.github.io/cards/）
repo_site=emoeem/cards

# 本地产物留底目录（JSON + PNG 每次分享都会留一份）
outbox=~~/media-cards

# 渲染 PNG 用的 ffmpeg（你的 ffmpeg-full）
ffmpeg=ffmpeg

# 卡片字体（libass 自动做 CJK 回退）
font=Sans

# 加载文件时自动显示卡片
auto_show=no
