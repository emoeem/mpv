#指定是否启用脚本功能，默认值：yes
#! 注意该选项可在运行中更改
enabled=yes
#指定 uosc 插件脚本 recentmenu 保存的最近播放记录的文件路径。可以是 mpv 支持的相对路径或绝对路径
path=~~/files/recent.json
#指定打开脚本菜单时显示的菜单标题
title=近期播放
#指定最近播放记录的保存条目的最大数量。默认值：1000；需要更多时可自行提高。
#达到上限后才移除最旧条目；重复播放相同路径会更新原条目。
length=1000
#指定 uosc 的最近播放记录的菜单条目的字符数限制。默认值：88
width=70
#列表按同目录、同剧名、同季的明确集号归组，仅展示最后播放的一集；原始历史仍逐集保留。
#是否在写入时只保留相同系列文件的最后播放条目。默认：no
#启用旧相似性合并会实际移除旧条目，可能误识别；无需启用即可获得列表归组效果。
ignore_same_series=no
# 是否把带签名/过期参数的临时网络直链保存到最近播放。
# 默认保存，避免云盘播放记录缺失；即使关闭，也只跳过新记录，不会批量删除已有历史。
keep_signed_urls=yes
