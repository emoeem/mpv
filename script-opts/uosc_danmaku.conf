## 指定弹幕服务器地址，自定义服务需兼容 dandanplay 的 api
## 可指定多个用英文逗号分隔的有序 api_server 列表
## 支持每项使用 '|' 或 '#' 分隔备注，例如: "https://a.example.com|备用A" 或 "https://b.example.com#备用B"
api_server=https://danmu.cynn.top/cynnsq|炊烟袅袅,https://api.dandanplay.net
## 指定 b 站和爱腾优的弹幕获取的兜底服务器地址，主要用于获取非动画弹幕
## 当前使用：https://dmku.hls.one
# 按顺序尝试；第二节点只在第一节点失败时使用
fallback_server=https://dmku.hls.one,https://danmaku-api.152468.xyz
## 设置 tmdb 的 API Key，用于获取非动画条目的中文信息(当搜索内容非中文时)
## 可以在 https://www.themoviedb.org 注册后去个人账号设置界面获取
## 注意：自定义此参数时还需要对获取到的 API Key 进行 base64 编码
#tmdb_api_key=NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM=
## 自动加载网络弹幕
auto_load=yes
## 自动加载失败后，严格按片名和集数搜索影视库并自动关联；宁可不自动，也不误关联
auto_search_associate=yes
## 自动关联使用严格模式：要求精确片名、唯一作品、明确集数
auto_search_strict=yes
## 自动关联英文片名时尝试 TMDB 转中文；默认关闭，避免外网依赖和额外等待
auto_search_tmdb=no
## 自动匹配弹幕延迟（秒）。延后联网/哈希匹配，让视频先完成启动；0 表示不延迟
auto_load_delay=1.0
## 自动加载本地弹幕
autoload_local_danmaku=no
## 为 URL 串流播放场景自动加载弹幕
autoload_for_url=yes
## 自动保存网络弹幕到本地（视频同目录下同名 xml 文件）
save_danmaku=no
## 禁用视频 fps 滤镜：弹幕使用独立 overlay 最高 60Hz 重绘，源视频保持原始 23.976/24/30/50/60fps
## 这样不会复制视频帧，也不会让格式 Logo 或画质策略误判为 60FPS
vf_fps=no
## 仅供手动切回 ASS 轨兼容模式时使用；默认 overlay 不会读取此参数
fps=60
## 弹幕渲染模式：默认 overlay 独立刷新；不占用第二字幕轨，也不修改视频滤镜链
render_mode=overlay
## 全屏宽银幕时优先将弹幕放入顶部黑边；黑边不足时保持普通布局
fullscreen_blackbar=yes
## overlay 的最高刷新率（20-60），实际不会超过显示器刷新率
overlay_fps=60
## 低帧率 overlay 使用 display-vdrop 随显示器刷新重绘；不插帧、不改变音频速度
overlay_display_sync=yes
## 指定合并重复弹幕的时间间隔的容差值，单位为秒。默认值：-1，表示禁用
merge_tolerance=0
## 合并重复弹幕时是否忽略类型和颜色差异。默认值：no
#merge_without_style=yes
## 限制同屏显示的最大弹幕数量，防止极端密度弹幕导致长时间播放越来越卡；0 表示不限制
max_screen_danmaku=120
## 指定弹幕关联历史记录文件的路径，支持绝对路径和相对路径
history_path=~~/files/danmaku-history.json

## 中文简繁转换。0-不转换，1-转换为简体，2-转换为繁体
chConvert=0
## 滚动弹幕的显示时间。这会左右滚动速度
scrolltime=20
## 固定弹幕的显示时间
fixtime=5
## 字体
fontname=LXGW WenKai Screen
## 字体大小 
fontsize=30
## 透明度
opacity=0.88
## 粗体
bold=yes
## 描边 0-4
outline=0.5
## 阴影
shadow=0
## 弹幕状态提示纵坐标；略微下移，避免贴近顶部其他脚本提示
message_y=48
## 全部弹幕的显示范围（0.0-1.0）
displayarea=0.11

## 指定弹幕屏蔽词文件路径（black.txt），支持绝对路径和相对路径。文件内容以换行分隔
## 支持 lua 的正则表达式写法
#blacklist_path=
## 自定义标题解析中的额外替换规则，内容格式为 JSON 字符串，替换模式为 lua 的 string.gsub 函数
##! 注意：由于 mpv 的 lua 版本限制，自定义规则只支持形如 %n 的捕获组写法，即示例用法，不支持直接替换字符的写法 
title_replace=[{"rules":[{ "^〔(.-)〕": "%1"},{ "^.*《(.-)》": "%1" }]}]
## 指定哈希匹配中需忽略的共享盘（挂载盘）的路径/目录。支持绝对路径和相对路径，多个路径用逗号分隔
## 示例：["X:", "Z:", "F:/Download/", "Download"]
#excluded_path=
