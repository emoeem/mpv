# 是否查询并在时间轴标记片头片尾
enabled=yes

# 是否进入片头片尾区间时自动跳过；可通过底栏按钮切换并自动保存
auto_skip=yes

# 数据源开关
anime_skip=yes
introdb=yes
# 当前集没有 TheIntroDB 数据时，使用同季指定集作为片头模板
season_fallback=yes
season_fallback_episode=1

# API 地址与 Anime Skip 公共客户端 ID
anime_skip_url=https://api.anime-skip.com/graphql
anime_skip_client_id=ZGfO0sMF3eCwLYf8yMSCJjlynwNGRXWE
introdb_url=https://api.theintrodb.org/v3/media
# TheIntroDB 官方扩展同样先通过 TMDb 把标题解析成媒体 ID
tmdb_api_url=https://api.tmdb.org/3
tmdb_api_key_base64=NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM=

# 网络超时（秒）和本地缓存有效期（天）
timeout=12
# 文件加载后延迟查询片头片尾（秒）。延后联网查询，让视频先完成启动；0 表示不延迟
lookup_delay=0.3
cache_days=30
# “未找到数据”的结果只短期缓存，避免数据库补充后长期不再查询
negative_cache_hours=12
# Anime Skip 返回的标准时长与当前文件允许相差的秒数，超过时拒绝自动匹配
duration_tolerance=180
cache_path=~~/files/skip-segments-cache.json

# 手动标记模板；series 表示同一电视剧所有集共用，season 表示仅同季共用
manual_templates_path=~~/files/skip-segments-manual.json
manual_template_scope=series
# 在网站片段前后多少秒内点击剪刀，视为纠正该网站片段
manual_correction_window=90

# 复用弹幕历史中的已关联动画标题，提高本地文件识别率
danmaku_history_path=~~/files/danmaku-history.json

# 分别启用片头与片尾
skip_intro=yes
skip_outro=yes
# 选择或切换到新视频后默认开始播放，避免编辑模式的暂停状态泄漏
autoplay_loaded_file=yes

# 切换和自动跳过时显示 OSD 提示
show_osd=yes
