# 指定脚本的工作方式，有三种模式可选：noth、pass、switch。默认值：noth
## noth：什么也不做
## pass：当显示器处于 HDR 模式时，为 HDR 内容传递 HDR 信号
## switch：根据 mpv 播放的视频内容在显示器的 HDR 模式和 SDR 模式之间自动切换，在 Windows 10 及更高版本的系统上可用
#! pass 模式只建议在 mpv v0.41.0 之前的版本使用，后续版本的 mpv 默参即已支持 hdr pass 无需额外配置
hdr_mode=noth
# 播放器输出偏好：auto 按片源/显示能力自动选择 HDR/SDR（默认）；
# sdr 只让 mpv 把 HDR 片源映射到 BT.709/gamma2.2/203 nit，不修改 Windows HDR 开关。
# 可在“杳知 > HDR 输出与峰值亮度 > 播放器输出模式”中持久切换。
output_mode=auto
# 视频输出范围：auto 由 gpu-next / D3D11 与系统协商（推荐）；仅在 64/66 黑位基准
# 明确显示范围不匹配时，才手动选择 full 或 limited。它与片源 Limited/Full 是两件事。
output_range=auto
# 指定是否仅在全屏或窗口最大化时自动切换 HDR 模式。仅在 hdr_mode=switch 时生效，默认值：no
fullscreen_only=no
# HDR 状态达到目标值时会立即继续；此项仅为显示器/系统切换异常时的最大等待时间（秒）
# 超时后脚本会按实际 hdr-status 应用输出配置并释放由脚本造成的暂停
hdr_wait=8
# 用于指定你的 HDR 显示器的目标峰值，默认值：0
# 默认使用 display-info.dll 提供的显示器峰值信息属性："user-data/display-info/max-luminance"
# 你也可以指定具体值以覆盖内部检测
#! 提醒：自定义此项时必须指定显示器的真实峰值亮度，否则会导致 HDR 内容显示不正确
target_peak=203
# 用于指定你的 HDR 显示器的最大对比度数值
# 默认值：auto。HDR→HDR 与 HDR→SDR 都只在 display-info.dll 同时提供可信峰值/黑位时
# 计算真实显示器对比度；数据缺失、为 0 或明显异常时继续交给 gpu-next/libplacebo 自动处理。
#! 提醒：自定义此项时必须指定为显示器的实测最大对比度，否则可能抬黑或压暗暗部
## 例如 100000 表示显示器最大对比度为 100000:1
## OLED 显示器可以指定特殊值 inf 以应用无限对比度
target_contrast=auto
