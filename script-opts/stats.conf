###不支持参数后注释，须另起一行

# -- 动态键位绑定（对应五个不同的信息页）
#key_page_1=1
#key_page_2=2
#key_page_3=3
#key_page_4=4
#key_page_0=0
##观影统计页（第 7 页）的键位
#key_page_7=7

# -- 动态键位绑定（部分页面支持上下翻页）
#key_scroll_up=UP
#key_scroll_down=DOWN
##设置滚动一次的行数。默认值：1
#scroll_lines=1

##短暂显示的持续时间（秒）。默认值：4
#duration=4
##常驻显示的数据刷新间隔（秒），设为 0 会有 bug。默认值：1
#redraw_delay=1
##文本格式化（ASS）。默认值：yes
##ass_formatting=yes
##禁止其它 OSD 文本覆盖 stats 信息。默认值：no
#persistent_overlay=yes
##设为 yes 将输出传递的完整信息。默认值：no
#print_perfdata_passes=no
##如果过滤器列表的长度超过这个数目，则每行显示一个过滤器。默认值：128
#filter_params_max_length=128
##启用调试输出。默认值：100
#debug=no

# -- 图形选项和样式
##显示性能数据的图表。默认值：no
#plot_perfdata=yes
##显示垂直同步和抖动值的图形（仅在统计信息常驻显示时）。默认值：no
#plot_vsync_ratio=yes
#plot_vsync_jitter=yes
##显示缓存值图表（第 3 页），仅在切换时显示。默认值：no
#plot_cache=no
##自动启用色调映射 LUT 可视化（仅在统计信息常驻显示时）。默认值：no
#plot_tonemapping_lut=no

#skip_frames=5
#global_max=yes
##切换时清除数据缓冲区。默认值：yes
#flush_graph_data=yes
plot_bg_border_width=1.25
# Dracula 主题，ASS/BGR 顺序：边框 Base 边 / 底 Base / 填充 紫强调
plot_bg_border_color=5A4744
plot_bg_color=2C2212
plot_color=F993BD

##指定是否使用视频缩放文本和图形。no 尝试保持大小不变，auto 使用 OSD 缩放文本和图形
##而 OSD 使用 window 或保持恒定大小，具体取决于 --osd-scale-by-window 选项。默认值：auto
#vidscale=auto
##统计面板左上角位置，给顶部弹幕预留空间
#position_x=15  # 旧版 stats 键，现行 mpv 不识别，改用 page_1_position 等
#position_y=105
#position_x_fullscreen=22
#position_y_fullscreen=92

# -- 字体相关设定
font=MFGA YouHei
font_mono=MFGA YouHei
##字体大小，默认 20；当前使用紧凑统计面板，避免压到底部进度条码率标签
font_size=15
font_size_fullscreen=18
##字体颜色：Catppuccin Mocha Text（ASS/BGR 顺序）
font_color=F8F8F2
##字体边框粗细，默认 1.2
border_size=1.1
border_size_fullscreen=1.3
##字体边框颜色，默认 262626
border_color=191A21
shadow_x_offset=0
shadow_y_offset=0
shadow_color=191A21
##<0-99> 字体透明度，似乎是百分比，默认 11
alpha=0

# -- 主题配色（概览卡片/标题/徽标；ASS/BGR 顺序，与 uosc.conf 的 Dracula 主题一致）
##标题/徽标/页脚活动项强调色（RGB #BD93F9 的 BGR 顺序）。默认 F993BD
#accent_color=F993BD
##字段标签颜色（RGB #6272A4 的 BGR 顺序）。默认 A47262
#label_color=A47262
##卡片底板填充色（RGB #21222C 的 BGR 顺序）。默认 2C2212
#panel_color=2C2212
##卡片底板透明度（ASS alpha：00 全显，ff 全隐）。默认 33
#panel_alpha=33
##卡片底板描边色（RGB #44475A 的 BGR 顺序）。默认 5A4744
#panel_border_color=5A4744
##是否绘制卡片底板（含标题分隔线）。默认 yes，no 回到 9.2 旧版纯文字外观
#panel_background=yes
##标题/标签/页脚是否使用主题色。默认 yes，no 同样回到旧版外观
#accent_colors=yes
##轨道页远程地址（轨标题/外部文件名）的展示上限字符数，超出时折叠为 主机/…/文件名。
##默认 96；本地文件路径不受影响
#track_url_max_length=96

# -- 自定义标头，用于设置 ASS 标签的文本输出样式
# -- 指定此参数将忽略上面的文本样式值并使用这个字符串代替
#custom_header=

# -- 文本格式（ASS）
#ass_nl=\\N
#ass_indent=\\h\\h\\h\\h\\h
#ass_prefix_sep=\\h\\h
#ass_b1={\\b1}
#ass_b0={\\b0}
#ass_it1={\\i1}
#ass_it0={\\i0}
# -- Without ASS
#no_ass_nl=\n
#no_ass_indent=\t
#no_ass_prefix_sep= 
#no_ass_b1=\027[1m
#no_ass_b0=\027[0m
#no_ass_it1=\027[3m
#no_ass_it0=\027[0m
