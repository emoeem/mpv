## content-adaptive.lua — 内容自适应画质引擎
## 决策树：HDR 源 / 直播 → 不挂超分；其余按 内容类型(动画/真人) × 分辨率(SD/HD/4K) × 帧率 选预设。
## 手动覆盖：CTRL+ALT+c 循环 动画/真人/自动；uosc「超分与补帧」菜单可改 off/auto/performance/quality。
## 用户手动改动 glsl-shaders（CTRL+0~9 / ALT+1~8）时，本文件内自动暂停，下个文件恢复。

enabled=yes

## 动画判定关键词（逗号分隔，不区分大小写，匹配完整路径）
## 命中压制组 / 片源 Tag 即判为动画；误判时用 CTRL+ALT+c 手动覆盖
anime_keywords=VCB-Studio,LoliHouse,Snow-Raws,Nekomoe,SweetSub,Moozzi2,SubsPlease,Ohys-Raws,Leopard-Raws,DHR,Baha,B-Global,AT-X,NC-RAWS,Kamigami,SMthsMix,anime,Anime
## 路径目录关键词（按 /关键词/ 段匹配）
anime_dir_keywords=anime,动漫,动画,番剧

## 分辨率分档：宽 ≤1280 且高 ≤720 → SD；宽 ≥3840 或高 ≥2160 → 4K；其余 HD
sd_max_width=1280
sd_max_height=720
uhd_min_width=3840

## 源帧率超过该值时不挂 FSRCNNX 类重组（4K 档不受影响）
high_fps_threshold=47

## 掉帧降档：drop_window_s 秒窗口内 VO 掉帧超过 drop_limit 帧 → 降一档
## 动画 Ani4K(ArtCNN) → Anime4K 轻量 → 仅色度；真人 SSimSuperRes → 仅色度
drop_window_s=30
drop_limit=60
degrade_cooldown_s=60
degrade_max=2

## 预设着色器（逗号分隔为一组，~~ 为配置目录）
## 动画 SD：FSRCNNX 畸变修复版（x1，不放大）
preset_anime_sd=~~/shaders/igv/FSRCNNX_x1_16-0-4-1_distort.glsl
## 动画 HD：Ani4K v2 ArtCNN（复用 [Ani4K] 配置组同款）
preset_anime_hd=~~/shaders/Ani4k/Ani4Kv2_ArtCNN_C4F32_i2_CMP.glsl
## 动画 HD 降档：Anime4K Restore 轻量组（复用 [Anime4K] 配置组核心）
preset_anime_hd_light=~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl,~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl
## 真人 SD：FSRCNNX 快速版
preset_live_sd=~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl
## 真人 HD：SSimSuperRes（复用 [SSIM] 配置组核心）
preset_live_hd=~~/shaders/igv/SSimSuperRes.glsl
## 所有 HD/4K 预设自动叠加色度增强（KrigBilateral）
krig=~~/shaders/igv/KrigBilateral.glsl
