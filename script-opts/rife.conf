# RIFE 补帧（vs-mlrt NCNN/Vulkan）
# 依赖 vapoursynth-plugin-mlrt-ncnn-runtime（emoeem 仓库提供）
# 快捷键：CTRL+ALT+r 开/关（input.conf）

# 加载文件时自动开启（默认手动按键开启）
enabled=no

# 补帧倍数，支持小数，如 1.5
multi=2

# 光流处理分辨率，4K 建议 0.5（要求 32/scale 为整数）
scale=1.0

# RIFE 模型版本：v4.6（基线包最高版本）
model=v4.6

# Vulkan 半精度，RTX 显卡建议开启
fp16=yes

# Vulkan 设备编号
device_id=0

# 场景切换检测阈值
threshold=0.1
