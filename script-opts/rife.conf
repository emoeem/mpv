# RIFE 补帧（vs-mlrt）
# N 卡推荐 ort_cuda：需要 vapoursynth-plugin-mlrt-ort-runtime-git（AUR）
# 性能更好可选 trt：需要 tensorrt + vapoursynth-plugin-mlrt-trt-runtime-git（AUR）
# 注意：ncnn 后端官方不支持 RIFE（模型含 GridSample 算子），会导致 mpv 崩溃，请勿使用
# 快捷键：CTRL+ALT+r 开/关（input.conf）

# 加载文件时自动开启（默认手动按键开启）
enabled=no

# 补帧倍数，支持小数，如 1.5
multi=2

# 光流处理分辨率，4K 建议 0.5
scale=1.0

# RIFE 模型版本：v4.6（基线包最高版本）
model=v4.6

# 半精度，RTX 显卡建议开启
fp16=yes

# 显卡编号：0 = 第一张卡
device_id=0

# 推理后端：ort_cuda（默认，需 vsort 插件）/ trt（需 TensorRT）/ ncnn（不支持 RIFE，勿用）
backend=ort_cuda

# 场景切换检测阈值
threshold=0.1
