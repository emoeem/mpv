# YouTube/B站视频、B站/抖音/斗鱼/虎牙直播本地解析。普通用户无需修改。
enabled=yes
resolver_timeout=18
max_candidates=8

# 清晰度无缝切换：选档后当前画面继续播放，后台完成新档位的解析与线路验证，
# 验证通过才换流；验证不过就保持当前播放不动。关掉则退回「先停流再重新解析」。
seamless_quality_switch=yes
# 单条线路预验证的超时（秒）与最少确认字节数。超时太短会把慢 CDN 误判成不可用。
quality_probe_timeout=6
quality_probe_bytes=65536

# 直播断流自动重连：连续失败达到该次数才放弃，期间会换同清晰度的其它 CDN 线路。
# 重连后播满 live_reconnect_alive_secs 秒视为本次恢复成功，配额归零；秒断的地址
# 播不满就照常累加，所以「最多 5 次」仍是上界。这个门槛要低于平台自己的断流周期
# （虎牙实测每条连接活 20~130 秒），否则一串几十秒的断流会把配额攒满、变成放弃。
# live_stable_reset_secs 管的是另一件事：多久之后忘掉刚断的那台主机。
live_reconnect_attempts=5
live_reconnect_alive_secs=8
live_stable_reset_secs=60

# B站、斗鱼、虎牙直播自动连接各平台匿名弹幕源；失败只停用弹幕，不影响画面。
# 抖音弹幕仍保持关闭，避免依赖不透明的外部签名服务。
live_danmaku=yes
live_danmaku_poll=0.35
live_danmaku_max_reconnects=3

# 可选：Netscape cookies.txt。文件不存在时保持匿名解析；不会读取浏览器或上传到第三方。
bilibili_cookie_file=~~/online-media/bilibili-cookies.txt

# 可选：斗鱼 Netscape cookies.txt。有蓝光档位的房间里，斗鱼会把原画扣给匿名请求
# （实测压到蓝光4M），登录后才授予原画；可从这里手工导入，或在“账号相关 >
# 斗鱼账号登录”里自动获取。同样只存本机、不上传。
douyu_cookie_file=~~/online-media/douyu-cookies.txt

# 可选：YouTube Netscape cookies.txt。匿名解析失败时可从“账号相关 > YouTube 登录验证”
# 主动获取；播放器不会在播放时静默读取浏览器，也不会上传 Cookie。
youtube_cookie_file=~~/online-media/youtube-cookies.txt

# 随包冻结的 Deno，仅用于 yt-dlp 的 YouTube JavaScript 挑战，禁止改成远程脚本服务。
# 留空 = 自动发现（先找随包 deno，再按 PATH 查找 deno / deno.exe）。
youtube_js_runtime=

# YouTube 清晰度解析仍完全使用随包冻结的本地组件；失败时才回退 mpv 原生 ytdl_hook。
# 留空 = 自动发现（先找随包 yt-dlp，再按 PATH 查找 yt-dlp / yt-dlp.exe）。
youtube_ytdl=
youtube_resolver=~~/online-media/resolve_youtube.py

# 随包内置 Python，仅执行本地解析与弹幕 helper。
# 留空 = 自动发现（随包 runtime/bin/python3；Windows 另试 runtime/Scripts/python.exe；
# 再按 PATH 查找 python3 / python）。
python_runtime=
