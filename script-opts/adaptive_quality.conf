# 跨机器自适应画质：按显卡档位、片源分辨率和帧率决定是否加载第三方着色器。
enabled=no

# 普通用户入口：“杳知 > 超分与补帧”。当前持久选择为自动，两项互相独立；
# 脚本内建安全回退仍为 off，配置缺失或损坏时不会意外增加普通播放负载。
# off 关闭；auto 自动；performance 性能优先；quality 质量优先。
superres_mode=auto
smooth_mode=auto

# 4K 补帧默认保留性能保护；可在“超分与补帧”菜单手动关闭。
# 完整依赖的“4K→2K 高性能补帧”是单独的显式策略，可接管该门槛；基础包、
# 自动档和完整依赖 native 档均不受影响，仍不会偷偷降采样。
protect_4k_smooth=yes
# 用户主动关闭 4K 保护时，额外预留硬解帧以承载插值队列；仅 4K 播放期间使用并自动恢复。
unprotected_4k_extra_frames=16

# 第二阶段在安全边界内由便携 RIFE Vulkan 生成 AI 中间帧；HDR10/HDR10+ 可走元数据保留路径，
# 音频直通仅在 RIFE 真正生成 2× 帧时保持原始音频时钟；RIFE 未启动时恢复普通播放，
# 不启用 Sphinx/display-vdrop，避免错时/延迟帧以及鼠标唤起 OSD 时的重绘放大。
# 入门/核显、Dolby Vision/HLG/HDR Vivid、ISO/VFR、高帧率、倍速或实时过载时自动安全回退。
# WebDAV/OpenAlist 可使用；音频直通时 RIFE 保留原音频时钟，未进入 RIFE 则恢复普通播放。
# 只有状态显示“RIFE AI 2×”才生成 AI 运动中间帧；Sphinx/Oversample 只按显示刷新进行时间重采样，不代表源帧率翻倍。
# performance 始终只使用原生轻量方案，不加载 AI 运行库。

# auto 自动识别；也可手动指定 low / balanced / medium / high。
tier=auto
unknown_tier=balanced

# Windows + D3D11 下自动选择检测到的最佳显卡；失败时由系统选择默认适配器。
auto_select_adapter=yes

# 自动着色器只使用通用型 SSim/FSRCNNX；Anime4K、Ani4K、NNEDI3、RAVU 始终手动。
auto_shaders=yes
# 中高档显卡在安全像素吞吐范围内自动使用 KrigBilateral 改善 4:2:0 色度升频。
auto_chroma=yes
# 持续监测实际 GPU 渲染时间和输出丢帧；预热/跳转/网络时钟压力不写入显卡学习档，
# 只有明确的本地实时渲染过载才持久学习，避免一次异常误伤后续正常片源。
performance_guard=yes
# RIFE 正常时继续使用现有显示节奏；遇到极端刷新率估算、持续音频时钟异常，或
# 高分辨率高刷输出预算不足时，优先保留 RIFE 真实 2×，仅关闭额外的显示节奏对齐。
# HDR/杜比全景声直通使用不改音频时钟的 gpu-next 安全原生平滑。
rife_clock_guard=yes
rife_clock_guard_interval=0.20
rife_clock_guard_start_delay=3.0
rife_clock_guard_hard_hz=1000
rife_clock_guard_hard_ratio=8.0
rife_clock_guard_audio_change=0.04
rife_clock_guard_avsync=0.30
rife_clock_guard_bad_samples=3
# 默认当前文件只降不升，下一文件重新从满画质开始，避免播放中反复切换 shader。
# 改为 yes 可在持续低负载后逐级恢复，但切换瞬间可能产生轻微画面变化或管线重建。
guard_auto_recover=no
show_osd=no

# 中档显卡（含 GTX 1060）：FSRCNNX 与 SSimDownscaler 仅用于不超过 30fps 的片源。
medium_fsrcnnx_max_fps=30.5
medium_downscale_max_fps=30.5

# 高档显卡：上述增强可用于不超过 60fps 的片源。
high_fsrcnnx_max_fps=60.5
high_downscale_max_fps=60.5
shader_max_fps=60.5

# 以“最终渲染宽×高×帧率”限制色度增强：中档约 1080p60，高档约 1440p60/4K30。
# 4K60 等窄余量场景不会自动加载，避免分享包在较弱机器上掉帧。
medium_chroma_max_pixel_rate=130000000
high_chroma_max_pixel_rate=260000000

# RIFE 与 FSRCNNX 共用 GPU：以下是两者可同时保留的最终输出吞吐边界。
# 若托管的质量超分与 RIFE 2× 冲突，保持 RIFE 原生源尺寸并只把显示放大层换为
# SSim 轻量增强；菜单和诊断会明确披露。用户手动 Shader 不会被自动替换。
# 完整依赖 uhd_2k 仍是唯一允许降低 RIFE 运动推理尺寸的显式空间取舍。
medium_rife_fsrcnnx_max_pixel_rate=130000000
# 普通高档/移动端/AMD/Intel 保留约 1080p60 的组合余量；1440p48/50 起优先
# 将重型放大换为轻量增强。桌面 RTX 4080/4090/5080/5090 在≤1440p 可放宽。
high_rife_fsrcnnx_max_pixel_rate=150000000
upper_high_rife_fsrcnnx_max_pixel_rate=300000000

# RIFE 已生成真实 2× 后，gpu-next 仅在安全预算内继续对齐显示器刷新率。
# 中档约 1440p60，高档覆盖 4K60/1440p120；4K120/144Hz 直接显示真实 RIFE 帧，
# 不再额外执行 50/60fps → 120/144Hz 的二次时间插值。
medium_rife_display_max_pixel_rate=260000000
high_rife_display_max_pixel_rate=520000000

# RTX 4080/5080 及更高档位在不超过 2560×1440 的输出上允许高刷节奏对齐：
# 1440p240 的 50fps RIFE 结果需要二次对齐才能消除 240÷50 的非整数重复卡顿。
# 4K120 仍受上方通用边界保护；真实过载时运行守卫会先关闭这层可选对齐。
upper_high_rife_1440p_display_max_pixel_rate=900000000

# 只对8bit、非 HDR、非8K且单位像素帧码率较低的片源自动去色带。
smart_deband=yes
deband_max_bpppf=0.060

# 动态保护：平均渲染耗时超过单帧预算的78%且连续2次才降级；
# 若启用 guard_auto_recover，低于50%并稳定15次才恢复。
# 默认每2秒采样，切换后等待8秒重新评估。
guard_interval=2.0
guard_start_delay=8.0
guard_change_cooldown=8.0
guard_high_ratio=0.78
guard_low_ratio=0.50
guard_bad_samples=2
guard_good_samples=15
guard_drop_delta=2
