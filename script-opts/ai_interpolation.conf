# 阶段二：便携 RIFE AI 补帧。普通用户仍在“杳知 > 超分与补帧”选择模式。
enabled=no

# VF 后端选择：auto 会在 RTX 40/50（含 Laptop/Max-Q）且独立
# rife-nvidia-tensorrt 扩展完整时使用 TensorRT FP16，其余情况继续使用
# 基础包 Vulkan。vulkan / nvidia_hq 供“一键增强模式 / 专业设置”托管；
# 两者互斥，不允许任意叠加。VSScript 已载入后切换 Python 运行库需要重启
# 播放器进程，设置会先安全保存，当前播放链不会被强拆。
backend_mode=auto

# 完整依赖处理方案：native 是基础包/自动档的兼容契约，始终保留源尺寸。
# uhd_2k 仅在完整依赖包与 RTX 40/50 上可选：4K 的运动推理等比降到
# 2560×1440 以内后执行 TensorRT RIFE 2×，属于用户显式接受的空间换时间方案。
# SDR 输出 2K 画布；HDR10/HDR10+ 保留原始 4K 帧，只把生成帧恢复到源尺寸。
# ai_superres 使用 AnimeJaNai V2 L1 x2 TensorRT 模型处理 SDR ≤1920×1080；
# 输出尺寸、真实帧率和后端都会写入状态，不能与普通 GPU 缩放混称。
# 完整依赖缺失、模型缺失、显卡架构不匹配或 DV/HLG/HDR Vivid 时自动拒绝并回退。
hq_processing_mode=native

# AI 与第一阶段“补帧”共用 off/auto/performance/quality：
# auto/quality 在安全边界内优先 RIFE；performance 只用 mpv 原生轻量平滑；
# RIFE 不可用、性能不足或触发保护时自动回到第一阶段策略。
# WebDAV/OpenAlist 与音频直通可使用 RIFE；顺序归档、光盘、VFR 和倍速仍保护。
# 音频直通只有在 RIFE 真实 2× 就绪后才保持原始音频时钟运行；若 AI 未准入或失败，
# 直接恢复普通播放，不用 display-vdrop/Sphinx 代替，以免错时帧被鼠标 OSD 重绘放大。
# HDR10/HDR10+ 可走 BT.2020/PQ 元数据保留的 RIFE 2×；DV/HLG/HDR Vivid 保持原生安全平滑。
# P7/FEL 不会为了显示补帧统计而丢弃 EL/FEL 或 RPU；只有未来能同时处理
# BL、EL/FEL 与生成帧 RPU 的完整实现才会解除这条保护。

# auto 使用第一阶段选中的物理显卡；必要时可填 Vulkan GPU 序号（从 0 开始）。
gpu_id=-1
# 基础包默认使用单 GPU 工作线程；中档卡“质量优先”仍保持一个 RIFE 工作线程，
# 但允许 VS 有界预取两帧以减少管线空泡；高档卡再让 VS 请求与 RIFE GPU 并发槽
# 配对：桌面普通高档卡限制为 2，桌面 RTX 4090/5090 Vulkan 限制为 4；
# Laptop/Max-Q Vulkan 固定单 GPU worker。TensorRT 4050/4060/4070 使用单流，
# 4080/4090/5080/5090 使用双流，最终仍由实时守卫决定是否保留。
# 若另行安装 rife-nvidia-tensorrt 完整依赖包，NVIDIA RTX 自动改用
# TensorRT FP16/CUDA Graph；未安装时仍使用主包内的小体积 Vulkan 方案。
gpu_thread=1

# 中档显卡自动档只以 768×432 以内推理；显式质量档使用实机稳定的
# 854×480 与双帧预取。960×540 在 GTX 1060 起播/seek 后没有实时余量，
# 会先丢帧再触发重建，因此不作为长期质量默认值。
# 基础包与完整依赖 native 模式继续执行“空间画质不得倒退”硬红线：RIFE 推理
# 尺寸低于源视频时不建图。唯一例外是用户显式选择 uhd_2k；该模式固定以 2K
# 为质量下限，实时不足直接回退，不继续降到 1080p/720p。HDR10/HDR10+ 可仅在
# 运动推理阶段使用该例外，输出仍保留源尺寸和逐帧属性；DV/HLG/HDR Vivid 不进入。
medium_auto_width=768
medium_auto_height=432
medium_quality_width=854
medium_quality_height=480
balanced_quality_width=640
balanced_quality_height=360
high_auto_width=1280
high_auto_height=720
high_quality_width=1600
high_quality_height=900

# 显式“质量优先”才会按桌面旗舰卡进一步提高运动推理精度：
# RTX 4080/5080 的 1080p、RTX 4090/5090 的 1440p 是后端实时能力上限，
# native 模式不允许把更高分辨率片源降到这些尺寸后补帧；只有片源本身不超过
# 对应上限时才进入原生尺寸 RIFE。显式 uhd_2k 则借鉴已验证参考方案，允许
# 4K → 2K TensorRT 运动推理，且菜单和运行状态必须披露这项质量取舍。
# 现代 NVIDIA RTX、AMD Radeon RX 5000+（RDNA 及以后）和 Intel Arc
# 可在自动/画质档尝试原生 1080p RIFE；不再要求先关闭超分，也不再因 Laptop/Max-Q
# 名称直接拒绝。是否真正保留由启动验证与持续守卫决定，失败只回退普通播放，
# 绝不把 1080p 暗中降成 720p；旧架构和非 Arc 集显继续沿用已测得的保守源尺寸上限。
upper_high_quality_width=1920
upper_high_quality_height=1080
flagship_quality_width=2560
flagship_quality_height=1440

# 旧中档自动档只处理电影常见 23.976/24fps；进入上述现代 GPU 原生 1080p
# 实时试跑的设备，以及高档或显式画质档，可处理到 30fps。
medium_auto_max_fps=24.5
quality_max_fps=30.5
high_auto_max_fps=30.5
source_max_pixels=2100000

# CFR 识别、初始化确认及连续过载回退。全部只作用于当前文件。
# 首次启用 RIFE 时先暂停视频链预热，模型与首帧就绪后再继续，避免启动阶段先慢后快；
# 超过预热上限仍未就绪会对本文件安全回退，不带着半初始化滤镜继续播放；
# 用户原本已暂停时不接管暂停状态，运行中降档也不会重复触发。
vfr_tolerance=0.018
start_delay=0.8
startup_gate=yes
startup_gate_timeout=7.0
# 预热暂停期间明确提示“完成后自动播放”，避免误以为播放器卡死而手动恢复。
startup_notice=yes
# RIFE 真实 2× 就绪后，先等待自适应画质完成一次超分/高刷预算切换；
# 已经处于暂停时再保留 1.2 秒有界蓄帧，运行中的手动刷新不新增固定停顿。
# 最终握手尚未提交、暂停/时间轴交互刚恢复播放时，守卫会滚动计数基线
# 并重新进入冷却，不把建图、纹理重建和队列释放误判为持续过载。
startup_quality_timeout=0.8
startup_ready_hold=1.2
verify_timeout=12.0
guard_interval=2.0
guard_start_delay=8.0
guard_drop_delta=3
guard_mistimed_delta=5
guard_bad_samples=2
guard_avsync=0.20
# 除丢帧/A-V 外同时检查“媒体进度÷真实时间”，避免弱卡在无音频或显示重采样下
# 以慢动作运行却被名义 2× 帧率误判为成功；连续低于 82% 才尝试降档。
# 若降档将低于源分辨率，直接触发空间画质保护并回到原生平滑。
guard_progress_ratio=0.82
# 全屏、最大化或拖动窗口会重建交换链/尺寸相关着色器；这段时间的瞬时丢帧不用于 AI 性能学习。
guard_presentation_cooldown=6.0
# 起播、精确 seek 或交换链变化后的 30 秒只允许当前文件临时降档；瞬态丢帧
# 不写入跨文件 GPU 上限，稳定播放足够久后的纯渲染过载才允许长期学习。
learning_settle_time=30.0
adaptive_learning=yes
max_runtime_downgrades=2
show_osd=no
