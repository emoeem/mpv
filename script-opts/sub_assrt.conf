# API token, 可以在 https://assrt.net 上注册账号后在个人界面获取
#示例为脚本内预设的 key
#api_token=tNjXZUnOJWcHznHDyalNMYqqP6IdDdpQ
# 是否使用 https，默认 yes
#use_https=no
# 代理设置
#proxy=

# 默认字幕源：all 聚合搜索；ask 每次选择；也可指定单源
default_source=all

# 可选 default_source=subtitlecat：无需 Key，仅下载已有字幕，不自动翻译。

# all：默认聚合搜索；ask：先选择来源；assrt/xunlei/subtitlecat：直接进入单源。
# Ctrl+F 或右键底栏字幕按钮打开；输入确认后才请求，字幕猫仅下载已有文件。
