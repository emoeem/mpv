# Wyzie Subs 在线字幕搜索
#
# Wyzie 的搜索接口只接受 TMDb / IMDb ID，不接受标题或文件名。脚本会自动
# 用文件名清洗出标题，经 TMDb 解析出 ID 后再查询，因此需要联网两次。
#
# 免费 API key 申请地址：https://store.wyzie.io/redeem
# 免费 key 每天 1000 次请求，可选源为 charlie 和 lima。

# Wyzie API key，留空时脚本只提示申请地址，不发请求
api_key=

# API 基础地址
# 官方文档使用 sub.wyzie.io；部分旧客户端仍写 sub.wyzie.ru，参数一致
api_url=https://sub.wyzie.io

# 语言过滤，ISO 639-1 代码，逗号分隔
language=zh,en

# 字幕格式过滤
format=srt,ass

# 字幕源：all 表示当前 key 可用的全部源
source=all

# 单次返回的结果上限，1-200
limit=50

# 单次请求超时（秒）
timeout=20

# 代理地址，留空不使用，例如 http://127.0.0.1:7890
proxy=

# TMDb 解析使用的基础地址与 key
# key 为 base64 编码，与 skip_segments.conf 保持一致
tmdb_api_url=https://api.tmdb.org/3
tmdb_api_key_base64=NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM=

# 下载完成后是否立即选中该字幕
auto_load=yes
