# 系统监控 OSD：CPU/GPU 温度、功耗、内存、电池
#
# 对照 Mpv∞ Stats Page 6 的桌面等价物。数据只读 sysfs 与 nvidia-smi，
# 不写任何系统状态。CTRL+ALT+y 开/关，显示期间每 interval 秒刷新。

# 刷新间隔（秒），最低 1
interval=2

# 左下角边距（按 OSD 高度的百分比）
margin=4

# OSD 字号（1080p 基准，会按实际分辨率缩放）
font_size=16

# 是否显示 GPU 行（nvidia-smi + AMD hwmon）
show_gpu=yes

# 是否显示内存占用
show_ram=yes

# 是否显示电池
show_battery=yes
