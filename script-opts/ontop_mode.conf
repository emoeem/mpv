# 三态置顶图钉按钮：全屏反馈大小再次微调版
# 位置固定在播放器窗口右上角，不跟随视频画面缩放/黑边变化
integrated_top_bar=yes

# 窗口模式位置：保持不变
right=198
top=6
width=44
height=40
icon_size=18

# 全屏模式位置与反馈大小：在上一版基础上适当放大一点
# 让反馈块更接近右侧系统按钮的悬停大小
fs_right=236
fs_top=19
fs_width=40
fs_height=38
fs_icon_size=18

# 渐显范围
fade_right_start=360
fade_right_full=210
fade_top_start=95
fade_top_full=45

# 亮度与反馈
off_opacity=0.48
active_opacity=1.00
hover_bg_opacity=0.92
hover_icon_opacity=1.00

# 顶栏中央状态提示：36px 顶栏内水平、垂直居中
feedback_top_bar_size=36
feedback_font_size=18
feedback_width=196
feedback_height=30

show_in_fullscreen=yes
