# 平台分流：用 mpv 的 platform 属性自动匹配，三平台共用同一份配置。
#
# 这些 profile 由 profile-cond 自动启用，不要手动 apply-profile。
# 从 mpv.conf / profiles.conf 移出来的平台绑定项集中在这里，方便核对：
#   gpu-context / ao / hwdec 的候选链
#
# 注意 gpu-context：只在 Linux 显式指定 waylandvk（本仓库的主要目标环境）。
# 平台属性的真实取值：linux / windows / darwin（macOS 报的是 darwin，不是 macos）。
# Windows / macOS 留空，由 mpv 自己按 GPU API 选择（Windows 常见 winvk/d3d11，
# macOS 只有 cocoa + VideoToolbox）。若在 X11 下用 Linux，把下面的 waylandvk
# 改成 x11vk 或删掉该行让 mpv 自选。
#
# hwdec 保持「首选 + auto-safe 兜底」的写法：不存在的硬解 API 会被 mpv 跳过，
# 所以三平台可以共用一条链，只是各自实际命中的项不同。

[platform-linux]
profile-desc=平台默认：Linux（Wayland/Vulkan + PipeWire）
profile-cond=get("platform") == "linux"
profile-restore=copy-equal
gpu-context=waylandvk
ao=pipewire
hwdec=nvdec-copy,vaapi-copy,auto-copy-safe

[platform-windows]
profile-desc=平台默认：Windows（WASAPI + D3D11VA）
profile-cond=get("platform") == "windows"
profile-restore=copy-equal
ao=wasapi
hwdec=nvdec-copy,d3d11va-copy,auto-copy-safe

[platform-macos]
profile-desc=平台默认：macOS（CoreAudio + VideoToolbox）
profile-cond=get("platform") == "darwin" or get("platform") == "macos"
profile-restore=copy-equal
ao=coreaudio
hwdec=videotoolbox,auto-copy-safe
